[build]
  base = "Speech Practice Web App"
  command = "npm ci && npm run build"
  publish = "Speech Practice Web App/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
# Netlify build settings for the project subdirectory and SPA routing
[build]
  base = "Speech Practice Web App"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
