[build]
  command = "cd \"Speech Practice Web App\" && pnpm install && pnpm build"
  publish = "Speech Practice Web App/dist"

# Environment variables required for email functionality
# Set these in Netlify UI: Site Settings > Build & Deploy > Environment
# VITE_EMAILJS_SERVICE_ID
# VITE_EMAILJS_TEMPLATE_ID
# VITE_EMAILJS_PUBLIC_KEY
# VITE_FEEDBACK_EMAIL

# Long-term caching for hashed static assets (JS, CSS, images, fonts)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache WebP and other images aggressively
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML: no cache (always fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
